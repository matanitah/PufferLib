[base]
env_name = ants

[vec]
# 16384 % 32 agents == 0 and 16384 % (8192/64) == 0
total_agents = 16384
num_buffers = 4
num_threads = 16

[env]
num_agents = 32
width = 1280
height = 720
reward_food_pickup = 0.1
reward_delivery = 10.0

[policy]
hidden_size = 128
num_layers = 4

[train]
# Sweep logs/sweep_ants_2 trial 82, exact values (rounding them changes the seed-73
# result). Score ~19.1 across 7 runs (one at 17.8); previous defaults scored 12.94.
# learning_rate 0.015 (default.ini) collapses to a uniform policy.
total_timesteps = 159_927_872
learning_rate = 0.00727265747
gamma = 0.988227844
gae_lambda = 0.930858731
replay_ratio = 1.48769236
clip_coef = 0.278604954
vf_coef = 2.19791222
vf_clip_coef = 3.38599277
max_grad_norm = 0.967007399
ent_coef = 0.000920225226
momentum = 0.916291714
minibatch_size = 4096
horizon = 32

[sweep]
metric = score

[sweep.train.total_timesteps]
distribution = log_normal
min = 5e7
max = 2e8
mean = 1e8
scale = time
