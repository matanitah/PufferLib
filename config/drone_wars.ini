[base]
env_name = drone_wars

[vec]
# 2 drones per env
total_agents = 4096
num_buffers = 4
num_threads = 16

[env]

[policy]
hidden_size = 128
num_layers = 4

# Ported from the 3.0 sweep config (adam_beta1 -> momentum, update_epochs -> replay_ratio)
[train]
total_timesteps = 500_000_000
learning_rate = 0.010933756713881205
gamma = 0.997472126425902
gae_lambda = 0.9641173414828333
replay_ratio = 1.0
clip_coef = 0.05982655642208556
vf_coef = 2.1319065538539963
vf_clip_coef = 0.5869845581530236
max_grad_norm = 1.6317688647793107
ent_coef = 0.002465076521024325
momentum = 0.9610890980775877
minibatch_size = 32768
horizon = 64
vtrace = 1
vtrace_rho_clip = 3.8183814893708057
vtrace_c_clip = 2.714930379733876

[sweep]
metric = score

[sweep.train.total_timesteps]
distribution = log_normal
min = 2e8
max = 4e8
mean = 2e8
scale = time
